<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Контакты</title> <!-- Изменили заголовок -->
    <!-- Подключаем Bootstrap через CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

<!-- ХЕДЕР -->
<header class="bg-dark text-white p-3">
    <div class="container d-flex justify-content-between">
        <h1>Мой сайт</h1>
        <nav>
            <a href="index.html" class="text-white me-3">Главная</a>
            <a href="contacts.html" class="text-white">Контакты</a>
        </nav>
    </div>
</header>

<!-- БОДИ (Основной контент) -->
<main class="container my-5 flex-grow-1">
    <h2 class="text-center mb-4">Свяжитесь с нами</h2>

    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card">
                <div class="card-body">
                    <!-- Форма обратной связи -->
                    <form action="/" method="POST">
                        <div class="mb-3">
                            <label for="nameInput" class="form-label">Ваше имя</label>
                            <input type="text" class="form-control" id="nameInput" name="name" placeholder="Иван Иванов" required>
                        </div>

                        <div class="mb-3">
                            <label for="emailInput" class="form-label">Email</label>
                            <input type="email" class="form-control" id="emailInput" name="email" placeholder="email@mail.ru" required>
                        </div>

                        <div class="mb-3">
                            <label for="messageInput" class="form-label">Сообщение</label>
                            <textarea class="form-control" id="messageInput" name="message" rows="3" placeholder="Ваше сообщение..." required></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Отправить</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- ФУТЕР -->
<footer class="bg-dark text-white text-center p-3 mt-auto">
    <p>&copy; 2026 Мой сайт. Все права защищены.</p>
</footer>

</body>
</html>
